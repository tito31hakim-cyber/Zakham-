workflows:
  android-release:
    name: Android signed release (AAB)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      android_signing:
        - zakham_android_keystore
    triggering:
      # الإصدارات الموسومة هي مصدر البناء الموثوق (الأولوية 1):
      # بناء الإنتاج يُطلق من Tag مثل v1.1.0-build29، وليس من دفع عشوائي.
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      tag_patterns:
        - pattern: v1.1.0-*
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Restore Firebase config from secret (optional)
        # يقرأ google-services.json من سرّ Codemagic إن وُجد (base64)؛
        # وإلا يُستخدم الملف المضمّن في المستودع (انظر سجل الخطة، P7).
        # لا يكسر شيئاً بغياب السرّ — الخطوة اختيارية بالكامل.
        script: |
          if [ -n "${CM_GOOGLE_SERVICES_JSON:-}" ]; then
            echo "$CM_GOOGLE_SERVICES_JSON" | base64 -D > android/app/google-services.json
            echo "google-services.json restored from Codemagic secret."
          else
            echo "No CM_GOOGLE_SERVICES_JSON secret; using the file from the repository."
          fi
      - name: Configure Flutter Android path
        script: echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate launcher icons
        # الأيقونات تُولَّد وقت البناء من الشعار النظيف (assets/brand/zakham-brand-mark.png)
        # لأن ملفات PNG الثنائية لا يمكن دفعها عبر موصل GitHub.
        script: dart run flutter_launcher_icons
      - name: Analyze Flutter project
        script: flutter analyze --no-fatal-infos
      - name: Run widget tests
        script: flutter test
      - name: Build signed Android App Bundle
        script: |
          # أرقام الإصدار تأتي من pubspec صراحةً (مثل iOS) حتى لا تعتمد
          # على عدّاد تشغيل Codemagic. الإصدار V1.1 ثابت وversionCode يزيد 1 مع كل إصدار.
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/^version: *//;s/[[:space:]]*$//')"
          COMMIT="${CM_COMMIT:-$(git rev-parse --short HEAD)}"
          flutter build appbundle --release --obfuscate --build-name="${VERSION%%+*}" --build-number="${VERSION##*+}" --dart-define=ZAKHAM_COMMIT="$COMMIT" --split-debug-info="$CM_BUILD_DIR/../zakham-debug-info-aab"
      - name: Build signed Android APK
        # ملف APK المنشور على الموقع /downloads/zakhamhouse.apk يأتي من هذا البناء.
        # --obfuscate يخفي أسماء الأصناف والدوال من الثنائي، وملف التعيين
        # يُحفظ خارج المستودع (مخرجات CI) لا في المستودع.
        script: |
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/^version: *//;s/[[:space:]]*$//')"
          COMMIT="${CM_COMMIT:-$(git rev-parse --short HEAD)}"
          flutter build apk --release --obfuscate --build-name="${VERSION%%+*}" --build-number="${VERSION##*+}" --dart-define=ZAKHAM_COMMIT="$COMMIT" --split-debug-info="$CM_BUILD_DIR/../zakham-debug-info-apk"
      - name: Generate release manifest
        # ملف release-manifest.json (الأولوية 8): الإصدار ورقم البناء
        # والـ commit ووقت البناء وبصمتا SHA-256 للـ APK والـ AAB — يُحفظ
        # ضمن مخرجات البناء ليُطابَق مع النسخة المنشورة على المتاجر.
        script: |
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/^version: *//;s/[[:space:]]*$//')"
          BUILD_NAME="${VERSION%%+*}"
          BUILD_NUMBER="${VERSION##*+}"
          COMMIT="${CM_COMMIT:-$(git rev-parse --short HEAD)}"
          BUILD_TIME="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
          AAB_PATH="$(ls build/app/outputs/bundle/release/*.aab 2>/dev/null | head -n 1)"
          APK_SHA="$(shasum -a 256 "$APK_PATH" | cut -d' ' -f1)"
          AAB_SHA=""
          if [ -n "$AAB_PATH" ]; then AAB_SHA="$(shasum -a 256 "$AAB_PATH" | cut -d' ' -f1)"; fi
          printf '{\n  "app": "House of ZAKHAM",\n  "package": "com.houseofzakham.house_of_zakham",\n  "version": "%s",\n  "versionCode": %s,\n  "codemagicBuild": "%s",\n  "commit": "%s",\n  "buildTimeUtc": "%s",\n  "apkSha256": "%s",\n  "aabSha256": "%s"\n}\n' "$BUILD_NAME" "$BUILD_NUMBER" "${CM_BUILD_ID:-}" "$COMMIT" "$BUILD_TIME" "$APK_SHA" "$AAB_SHA" > release-manifest.json
          cat release-manifest.json
    artifacts:
      - build/**/outputs/**/*.aab
      - build/app/outputs/flutter-apk/app-release.apk
      - release-manifest.json
      - ../zakham-debug-info-aab/**
      - ../zakham-debug-info-apk/**
    publishing:
      email:
        recipients:
          - tito31hakim@gmail.com
        notify:
          success: true
          failure: true

  ios-release:
    name: iOS signed release (IPA)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: zakham_appstore_connect
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.houseofzakham.houseofzakham
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate launcher icons
        # الأيقونات تُولَّد وقت البناء من الشعار النظيف (assets/brand/zakham-brand-mark.png)
        # لأن ملفات PNG الثنائية لا يمكن دفعها عبر موصل GitHub.
        script: dart run flutter_launcher_icons
      - name: Install CocoaPods dependencies
        script: pod install --project-directory=ios
      - name: Configure iOS signing profiles
        script: xcode-project use-profiles
      - name: Analyze Flutter project
        script: flutter analyze --no-fatal-infos
      - name: Run widget tests
        script: flutter test
      - name: Build signed iOS IPA
        script: |
          # الإصدار من pubspec.yaml مباشرةً حتى لا ينحرف عن Android.
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/^version: *//;s/[[:space:]]*$//')"
          flutter build ipa --release \
            --build-name="${VERSION%%+*}" \
            --build-number="${VERSION##*+}" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - tito31hakim@gmail.com
        notify:
          success: true
          failure: true
