workflows:
  android-release:
    name: Android signed release (AAB)
    max_build_duration: 120
    instance_type: mac_mini_m2
    environment:
      flutter: stable
      android_signing:
        - zakham_android_keystore
    triggering:
      # الإصدارات الموسومة هي مصدر البناء الموثوق (الأولوية 1):
      # بناء الإنتاج يُطلق من Tag مثل v1.1.0-build29، وليس من دفع عشوائي.
      events:
        - push
        - pull_request
        - tag
      branch_patterns:
        - pattern: main
          include: true
          source: true
      tag_patterns:
        - pattern: v1.1.0-*
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Configure Flutter Android path
        script: echo "flutter.sdk=$HOME/programs/flutter" > "$CM_BUILD_DIR/android/local.properties"
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate launcher icons
        # الأيقونات تُولَّد وقت البناء من الشعار النظيف (assets/brand/zakham-brand-mark.png)
        # لأن ملفات PNG الثنائية لا يمكن دفعها عبر موصل GitHub.
        script: dart run flutter_launcher_icons
      - name: Analyze Flutter project
        script: flutter analyze --no-fatal-infos
      - name: Run widget tests
        script: flutter test
      - name: Build signed Android App Bundle
        script: |
          # أرقام الإصدار تأتي من pubspec صراحةً (مثل iOS) حتى لا تعتمد
          # على عدّاد تشغيل Codemagic — رقم البناء الوحيد هو versionCode.
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/^version: *//;s/[[:space:]]*$//')"
          COMMIT="${CM_COMMIT:-$(git rev-parse --short HEAD)}"
          flutter build appbundle --release --obfuscate --build-name="${VERSION%%+*}" --build-number="${VERSION##*+}" --dart-define=ZAKHAM_COMMIT="$COMMIT" --split-debug-info="$CM_BUILD_DIR/../zakham-debug-info-aab"
      - name: Build signed Android APK
        # ملف APK المنشور على الموقع /downloads/zakhamhouse.apk يأتي من هذا البناء.
        # --obfuscate يخفي أسماء الأصناف والدوال من الثنائي، وملف التعيين
        # يُحفظ خارج المستودع (مخرجات CI) لا في المستودع.
        script: |
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/^version: *//;s/[[:space:]]*$//')"
          COMMIT="${CM_COMMIT:-$(git rev-parse --short HEAD)}"
          flutter build apk --release --obfuscate --build-name="${VERSION%%+*}" --build-number="${VERSION##*+}" --dart-define=ZAKHAM_COMMIT="$COMMIT" --split-debug-info="$CM_BUILD_DIR/../zakham-debug-info-apk"
    artifacts:
      - build/**/outputs/**/*.aab
      - build/app/outputs/flutter-apk/app-release.apk
      - ../zakham-debug-info-aab/**
      - ../zakham-debug-info-apk/**
    publishing:
      email:
        recipients:
          - tito31hakim@gmail.com
        notify:
          success: true
          failure: true

  ios-release:
    name: iOS signed release (IPA)
    max_build_duration: 120
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: zakham_appstore_connect
    environment:
      flutter: stable
      xcode: latest
      cocoapods: default
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.houseofzakham.houseofzakham
    triggering:
      events:
        - push
        - pull_request
      branch_patterns:
        - pattern: main
          include: true
          source: true
      cancel_previous_builds: true
    scripts:
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate launcher icons
        # الأيقونات تُولَّد وقت البناء من الشعار النظيف (assets/brand/zakham-brand-mark.png)
        # لأن ملفات PNG الثنائية لا يمكن دفعها عبر موصل GitHub.
        script: dart run flutter_launcher_icons
      - name: Install CocoaPods dependencies
        script: pod install --project-directory=ios
      - name: Configure iOS signing profiles
        script: xcode-project use-profiles
      - name: Analyze Flutter project
        script: flutter analyze --no-fatal-infos
      - name: Run widget tests
        script: flutter test
      - name: Build signed iOS IPA
        script: |
          # الإصدار من pubspec.yaml مباشرةً حتى لا ينحرف عن Android.
          VERSION="$(grep '^version:' pubspec.yaml | sed 's/^version: *//;s/[[:space:]]*$//')"
          flutter build ipa --release \
            --build-name="${VERSION%%+*}" \
            --build-number="${VERSION##*+}" \
            --export-options-plist=/Users/builder/export_options.plist
    artifacts:
      - build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - tito31hakim@gmail.com
        notify:
          success: true
          failure: true
